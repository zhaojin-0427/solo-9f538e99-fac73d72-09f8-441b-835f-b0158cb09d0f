<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}票款入仓校对{% endblock %}</title>
  <style>
    :root { --line:#d8dde6; --muted:#6b7280; --ok:#0a7d33; --err:#b42318; --accent:#1d4ed8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
           color:#1f2733; background:#f5f7fa; }
    header { background:#10243e; color:#fff; padding:14px 24px; }
    header h1 { margin:0; font-size:18px; font-weight:600; }
    main { max-width:1180px; margin:24px auto; padding:0 20px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:20px; }
    .card h2 { margin:0 0 12px; font-size:15px; }
    table { border-collapse:collapse; width:100%; font-size:13px; }
    th, td { border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:middle; }
    th { background:#f0f3f8; font-weight:600; }
    td.num, th.num { text-align:right; font-variant-numeric: tabular-nums; }
    .muted { color:var(--muted); }
    .tag { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; }
    .tag-ok { background:#e7f6ec; color:var(--ok); }
    .tag-warn { background:#fef3c7; color:#92400e; }
    .tag-fixed { background:#e0ecff; color:var(--accent); }
    .tag-warehouse { background:#ede9fe; color:#5b21b6; }
    .flash { padding:10px 14px; border-radius:8px; margin-bottom:14px; font-size:13px; }
    .flash.error { background:#fdecea; color:var(--err); border:1px solid #f5c2c0; }
    .flash.ok { background:#e7f6ec; color:var(--ok); border:1px solid #b7e0c4; }
    form.inline { display:inline; }
    label.cand { display:inline-flex; align-items:center; gap:4px; margin-right:10px;
                 padding:3px 8px; border-radius:6px; cursor:pointer; }
    label.cand.disabled { color:#a8b0bd; cursor:not-allowed; text-decoration:line-through; }
    button { font-size:13px; padding:6px 14px; border-radius:6px; border:1px solid var(--accent);
             background:var(--accent); color:#fff; cursor:pointer; }
    button.ghost { background:#fff; color:var(--accent); }
    button.danger { border-color:var(--err); background:#fff; color:var(--err); }
    button:disabled { background:#c3cad6; border-color:#c3cad6; color:#fff; cursor:not-allowed; }
    .upload-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:12px; }
    .upload-grid label { font-size:13px; font-weight:600; display:block; margin-bottom:6px; }
    .upload-grid input[type=file] { font-size:12px; width:100%; }
    .totals { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .small { font-size:12px; }
  </style>
</head>
<body>
<header><h1>旧票款清单 · 入仓校对</h1></header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
